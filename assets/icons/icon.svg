<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e131c"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g filter="url(#glow)" stroke-linecap="round">
    <!-- dumbbell bar -->
    <rect x="150" y="238" width="212" height="36" rx="18" fill="url(#bar)"/>
    <!-- left weights -->
    <rect x="96" y="196" width="40" height="120" rx="18" fill="#00e5ff"/>
    <rect x="140" y="216" width="26" height="80" rx="13" fill="#00e5ff"/>
    <!-- right weights -->
    <rect x="376" y="196" width="40" height="120" rx="18" fill="#ff2e97"/>
    <rect x="346" y="216" width="26" height="80" rx="13" fill="#ff2e97"/>
  </g>
</svg>
